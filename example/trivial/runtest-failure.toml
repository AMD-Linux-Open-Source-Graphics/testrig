name = "trivial-failure"

# Run testrig from this directory (test_binary_path is resolved against cwd),
# e.g. `testrig -f runtest-failure.toml run`.
extra_args = ["--exit-code", "1"]

[fedora]
test_binary_path = "."
test_binaries = ["trivialtool.py"]
test_package_name = "python3"
test_debug_package_names = ["python3-debug"]

[ubuntu]
test_binary_path = "."
test_binaries = ["trivialtool.py"]
test_package_name = "python3"
test_debug_package_names = ["python3-dbg"]
